# Seed CI — gates every slice (REQ-SEED-EZPD6B85).
# Purpose: one workflow running all v1 gates: TS tests + typecheck,
# boundary gate, research catalog, Rust fmt/clippy/test, ruff/pytest,
# corpus determinism + eval smoke + doctor. Why: promotion and merge
# decisions trust these gates; red CI blocks.
# trace:v1 id=impl.ci work=WORK-SEED-6VF90M7B satisfies=REQ-SEED-EZPD6B85
name: ci

on:
  "push": {}
  "pull_request": {}

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      SEED_GUARDIAN_URL: http://127.0.0.1:7788
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system deps (apt)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (yarn 4.9.2)
        run: corepack enable

      - name: Install TS workspaces
        run: yarn install --immutable

      - name: TS tests (110 node:test cases)
        run: yarn test

      - name: TS typecheck (tsc --noEmit per package)
        run: yarn typecheck

      - name: Boundary gate (guardian/organism split)
        run: node scripts/verify-boundaries.ts

      - name: Static gate (schemas + manifests)
        run: yarn seed schema validate

      - name: Research catalog validation
        run: python3 scripts/seed-research-catalog.py

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Python sync (locked)
        run: uv sync --locked --project python/seed_evolution

      - name: Ruff
        run: uv run --no-project ruff check python/seed_evolution scripts/generate-core-evals.py

      - name: Pyright
        run: uv run --no-project --with pyright pyright python/seed_evolution

      - name: Pytest
        run: uv run --project python/seed_evolution pytest python/seed_evolution

      - name: Corpus determinism (exactly 60 tasks, seed 1337)
        run: uv run --project python/seed_evolution python scripts/generate-core-evals.py --seed 1337 --output evals/core/generated && test $(ls evals/core/generated | wc -l) -eq 60

      - name: Eval smoke (fail-then-pass oracle contract)
        run: yarn seed eval smoke

      - name: Doctor (nonzero on failure)
        run: yarn seed doctor
