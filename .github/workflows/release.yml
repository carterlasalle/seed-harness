# Seed release — SBOM + build provenance on tags (AGENTS.md 53, scope: releases).
# Purpose: every `v*` tag produces a CycloneDX SBOM of the shippable surface
# (TS workspaces, guardian crates, evolution package) plus a Sigstore
# attestation binding the SBOM to the exact tag commit. Why: promotion and
# rollback decisions reference exact hashes; a release must prove what it is.
# No package is published; artifacts are release-attached evidence only.
# trace:v1 id=impl.release-workflow work=WORK-SEED-6VF90M7B satisfies=REQ-SEED-EZPD6B85
name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify tag is on protected main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "SEED-UNPROTECTED-TAG: $GITHUB_SHA is not an ancestor of protected main"; exit 1; }
      - name: Enable corepack (yarn 4.9.2)
        run: corepack enable
      - name: Install TS workspaces
        run: yarn install --immutable
      - name: Generate SBOM (CycloneDX)
        run: node scripts/generate-sbom.mjs --out artifacts/seed-sbom.cdx.json
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@1eb3cb2b3e0f29609092a73eb033bb759a334595 # v4.1.0
        with:
          name: seed-sbom
          path: artifacts/seed-sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: artifacts/seed-sbom.cdx.json
