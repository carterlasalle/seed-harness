# Seed release — SBOM + build provenance + PyPI publish on tags.
# Purpose: every `v*` tag produces a CycloneDX SBOM of the shippable surface
# (TS workspaces, guardian crates, evolution package) plus a Sigstore
# attestation binding the SBOM to the exact tag commit, and publishes
# seed-evolution to PyPI via Trusted Publishing (no credentials in repo).
# Why: promotion and rollback decisions reference exact hashes; a release
# must prove what it is and ship the installable artifact.
# Trace: tag version must equal python/seed_evolution version (checked in CI).
# trace:v1 id=impl.release-workflow work=WORK-SEED-6VF90M7B satisfies=REQ-SEED-EZPD6B85

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on protected main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "SEED-UNPROTECTED-TAG: $GITHUB_SHA is not an ancestor of protected main"; exit 1; }
      - name: Enable corepack (yarn 4.9.2)
        run: corepack enable
      - name: Install TS workspaces
        run: yarn install --immutable
      - name: Generate SBOM (CycloneDX)
        run: node scripts/generate-sbom.mjs --out artifacts/seed-sbom.cdx.json
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seed-sbom
          path: artifacts/seed-sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/seed-sbom.cdx.json

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [sbom-attest]
    environment: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          project_version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("python/seed_evolution/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$project_version" || { echo "tag $tag_version != package $project_version"; exit 1; }
      - name: Install uv
        run: pip install uv
      - name: Build
        run: uv build --project python/seed_evolution --out-dir dist
      - name: Publish to PyPI
        run: uv publish
      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  # npm via Trusted Publishing: OIDC exchange with npmjs.com, so no long-lived
  # token exists in this repository or anywhere else. Each package must have a
  # trusted publisher configured on npmjs.com naming this repository and this
  # workflow file; that is a one-time operator step, not something this job can
  # grant itself. Provenance is attached automatically by the exchange.
  npm-publish:
    runs-on: ubuntu-latest
    needs: [sbom-attest]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag matches every package version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          for manifest in packages/*/package.json; do
            version="$(node -p "require('./${manifest}').version")"
            test "$version" = "$tag_version" \
              || { echo "${manifest} is ${version}, tag is ${tag_version}"; exit 1; }
          done
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        # OIDC publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install --global npm@11.5.1
      - name: Enable corepack (yarn 4.9.2)
        run: corepack enable
      - name: Install TS workspaces
        run: yarn install --immutable
      - name: Build TS workspaces (dist for cross-package imports)
        run: yarn exec tsc -p packages/seed-core/tsconfig.json && yarn exec tsc -p packages/seed-runtime/tsconfig.json && yarn exec tsc -p packages/seed-lab/tsconfig.json && yarn exec tsc -p packages/seed-tui/tsconfig.json && yarn exec tsc -p packages/seed-cli/tsconfig.json
      - name: Publish packages
        # Dependency order: a consumer resolves its pins at install time.
        run: |
          set -euo pipefail
          for dir in seed-core seed-runtime seed-lab seed-tui seed-cli; do
            echo "::group::npm publish @carterlasalle/${dir}"
            ( cd "packages/${dir}" && npm publish --access public --provenance )
            echo "::endgroup::"
          done
