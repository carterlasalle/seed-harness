# Purpose: Coding-harness mechanisms Seed learns from. Each entry: id/title/source/tags/problemClasses/
# mechanismSummary/implementationIdeas plus hashline (sha256 of the
# mechanismSummary text, recomputed by scripts/seed-research-catalog.py per
# spec section 93) and snapcompact (<source-ref>@<revision> per section 94).
