# seed-evolution: GEPA-style prompt/weight evolution package (REQ-SEED-D5V8QCMS).
# Stdlib-only runtime; `seed-gepa` entry point lands under TASK-SEED-7QCRZK5B.
[project]
name = "seed-evolution"
version = "0.1.5"
description = "Seed evolution loop: GEPA contract, scientist, mutation reports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "carterlasalle" }]
keywords = ["agents", "evolution", "gepa", "coding-harness", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/carterlasalle/seed-harness"
Repository = "https://github.com/carterlasalle/seed-harness"
Issues = "https://github.com/carterlasalle/seed-harness/issues"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
seed-gepa = "seed_evolution.gepa_optimizer:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
